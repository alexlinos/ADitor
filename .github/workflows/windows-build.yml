name: Windows build

on:
  push:
    branches: [main, windows-build]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[gui,smb,dev]" pyinstaller

      # --collect-data carries controls.json and the app's web files;
      # smbclient is imported lazily, so it is collected explicitly.
      # Distinct names: Windows filenames are case-insensitive, so aditor.exe
      # and ADitor.exe would be the same file.
      - name: Build aditor-cli.exe (command line)
        run: >
          pyinstaller --noconfirm --onefile --name aditor-cli
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_cli.py

      - name: Build ADitor.exe (desktop app)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ADitor
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_app.py

      - name: Smoke test
        shell: pwsh
        run: |
          dist\aditor-cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\aditor-cli.exe scan --config missing.json
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        with:
          name: aditor-windows
          path: dist/*.exe

      # After the upload, so a Windows-only test failure still leaves a build
      # to try; the run is still marked failed.
      - name: Tests
        run: pytest -q

  # The build runner has Python installed, so the smoke test above can't show
  # the exe runs without it. Windows Server Core in a container has no Python,
  # uv or pip, and no WebView2, so only the CLI is run there.
  clean-machine:
    needs: build
    runs-on: windows-2022  # process isolation needs the container to match the host
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aditor-windows
          path: dist

      # The Docker service isn't always running yet when the job starts.
      - name: Start Docker
        shell: pwsh
        run: |
          Start-Service docker
          foreach ($i in 1..30) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 5
          }
          throw "Docker did not start"

      - name: Run aditor-cli.exe on Server Core with no Python
        shell: pwsh
        run: |
          docker run --rm -v "${PWD}\dist:C:\app" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -NoProfile -Command '
              if (Get-Command python, py, uv -ErrorAction SilentlyContinue) { throw "this container has Python" }
              C:\app\aditor-cli.exe --help
              if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }
              C:\app\aditor-cli.exe scan --config missing.json
              if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
              "aditor-cli.exe ran with no Python on the machine"
              exit 0'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Only for a v* tag, and only after the tests and the clean-machine run pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, clean-machine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aditor-windows
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ADitor.exe aditor-cli.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ADitor.exe aditor-cli.exe SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --title "ADitor $GITHUB_REF_NAME" --generate-notes
