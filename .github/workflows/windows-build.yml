name: Windows build

on:
  push:
    branches: [main, windows-build]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # the release step attaches the exes to a GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[gui,smb,dev]" pyinstaller

      # --collect-data carries controls.json and the app's web files;
      # smbclient is imported lazily, so it is collected explicitly.
      # Distinct names: Windows filenames are case-insensitive, so aditor.exe
      # and ADitor.exe would be the same file.
      - name: Build aditor-cli.exe (command line)
        run: >
          pyinstaller --noconfirm --onefile --name aditor-cli
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_cli.py

      - name: Build ADitor.exe (desktop app)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ADitor
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_app.py

      - name: Smoke test
        shell: pwsh
        run: |
          dist\aditor-cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\aditor-cli.exe scan --config missing.json
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        with:
          name: aditor-windows
          path: dist/*.exe

      # After the upload, so a Windows-only test failure still leaves a build
      # to try; the run is still marked failed.
      - name: Tests
        run: pytest -q

      # Only for a v* tag, and only after the tests pass.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME dist\ADitor.exe dist\aditor-cli.exe dist\SHA256SUMS.txt --title "ADitor $env:GITHUB_REF_NAME" --generate-notes
