name: Windows build

on:
  push:
    branches: [main, windows-build]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[gui,smb,dev]" pyinstaller

      # --collect-data carries controls.json and the app's web files;
      # smbclient is imported lazily, so it is collected explicitly.
      # Distinct names: Windows filenames are case-insensitive, so aditor.exe
      # and ADitor.exe would be the same file.
      # SignPath requires product name and version on the signed files.
      - name: Version resources
        run: |
          python packaging/version_info.py aditor-cli "ADitor command line" > cli-version.txt
          python packaging/version_info.py ADitor "ADitor desktop app" > app-version.txt

      - name: Build aditor-cli.exe (command line)
        run: >
          pyinstaller --noconfirm --onefile --name aditor-cli
          --version-file cli-version.txt
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_cli.py

      - name: Build ADitor.exe (desktop app)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ADitor
          --version-file app-version.txt
          --collect-data aditor --collect-submodules aditor
          --collect-submodules smbclient --collect-submodules smbprotocol
          packaging/aditor_app.py

      - name: Smoke test
        shell: pwsh
        run: |
          dist\aditor-cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\aditor-cli.exe scan --config missing.json
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          $version = python -c "import aditor; print(aditor.__version__)"
          foreach ($exe in 'ADitor.exe', 'aditor-cli.exe') {
            $info = (Get-Item "dist\$exe").VersionInfo
            if ($info.ProductName -ne 'ADitor' -or $info.ProductVersion -ne $version) {
              throw "$exe has ProductName '$($info.ProductName)', ProductVersion '$($info.ProductVersion)'"
            }
          }

      # The NTLMv1 export script can't be run anywhere else: run it on this
      # machine's own logs with Windows PowerShell 5.1, as an admin would, and
      # check the built exe reads what it writes.
      - name: NTLMv1 export script runs and its CSV parses
        shell: pwsh
        run: |
          dist\aditor-cli.exe ntlm-script | Out-File -Encoding ascii export.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File export.ps1
          if (-not (Test-Path ntlmv1-evidence.csv)) { throw "the script wrote no CSV" }
          Get-Content ntlmv1-evidence.csv -TotalCount 8
          dist\aditor-cli.exe ntlm-check ntlmv1-evidence.csv
          if ($LASTEXITCODE -eq 2) { throw "ntlm-check could not read the export" }
          if (-not (Select-String -Path ntlmv1-evidence.csv -Pattern '"log-oldest"' -Quiet)) {
            throw "the script didn't read this machine's Security log"
          }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: aditor-windows
          path: dist/*.exe

      # After the upload, so a Windows-only test failure still leaves a build
      # to try; the run is still marked failed.
      - name: Tests
        run: pytest -q

  # The build runner has Python installed, so the smoke test above can't show
  # the exe runs without it. Windows Server Core in a container has no Python,
  # uv or pip, and no WebView2, so only the CLI is run there.
  clean-machine:
    needs: build
    runs-on: windows-2022  # process isolation needs the container to match the host
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aditor-windows
          path: dist

      # The Docker service isn't always running yet when the job starts.
      - name: Start Docker
        shell: pwsh
        run: |
          Start-Service docker
          foreach ($i in 1..30) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 5
          }
          throw "Docker did not start"

      - name: Run aditor-cli.exe on Server Core with no Python
        shell: pwsh
        run: |
          docker run --rm -v "${PWD}\dist:C:\app" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -NoProfile -Command '
              if (Get-Command python, py, uv -ErrorAction SilentlyContinue) { throw "this container has Python" }
              C:\app\aditor-cli.exe --help
              if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }
              C:\app\aditor-cli.exe scan --config missing.json
              if ($LASTEXITCODE -ne 2) { throw "expected exit 2, got $LASTEXITCODE" }
              "aditor-cli.exe ran with no Python on the machine"
              exit 0'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Only for a v* tag, and only after the tests and the clean-machine run pass.
  # Signing is off until the repository variable SIGNPATH_ORGANIZATION_ID is
  # set (with the secret SIGNPATH_API_TOKEN); until then releases go out
  # unsigned, as before. Once it is on, a release fails rather than ship an
  # unsigned exe.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, clean-machine]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read  # SignPath reads the build artifact through the GitHub API
    steps:
      - uses: actions/download-artifact@v7
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        with:
          name: aditor-windows
          path: dist

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ADitor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Check signatures
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($exe in 'ADitor.exe', 'aditor-cli.exe') {
            $sig = Get-AuthenticodeSignature "dist\$exe"
            if ($sig.Status -ne 'Valid') { throw "$exe signature: $($sig.Status) $($sig.StatusMessage)" }
            "$exe signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # LF line endings, so `sha256sum -c` / `shasum -c` can check it too.
          $lines = Get-FileHash ADitor.exe, aditor-cli.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          gh release create $env:GITHUB_REF_NAME ADitor.exe aditor-cli.exe SHA256SUMS.txt `
            -R $env:GITHUB_REPOSITORY --title "ADitor $env:GITHUB_REF_NAME" --generate-notes `
            --notes "Code signing policy: https://github.com/alexlinos/ADitor#code-signing-policy"
