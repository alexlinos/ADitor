[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aditor"
version = "0.1.2"
description = "A read-only Active Directory / GPO hardening auditor"
requires-python = ">=3.12"
authors = [
    {name = "Alex Linos"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "active-directory", "ldap", "ad", "group-policy", "gpo",
    "auditing", "hardening", "security", "directory-services",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Authentication",
]

dependencies = [
    "ldap3>=2.9.1,<3.0.0",
    "cryptography>=41.0.0,<42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<0.2.0",
]
# Optional: lets the scan read GPO settings from SYSVOL over SMB.
smb = [
    "smbprotocol>=1.10.0,<2.0.0",
]
# Optional: the desktop app (``python -m aditor.app``). Deliberately an extra,
# not a runtime dependency -- the ``aditor`` command must keep installing and
# running on a host with no GUI toolkit at all. Nothing on the CLI's import
# path reaches ``aditor.app.shell``, which is the only module that imports
# pywebview, and it imports it lazily. pywebview drives the OS's own web view
# (WebView2 on Windows, WebKit on macOS): one dependency instead of a bundled
# browser, and the shape the PyInstaller packaging work is planned around.
gui = [
    "pywebview>=5.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/alexlinos/ADitor"
Documentation = "https://github.com/alexlinos/ADitor#readme"
Repository = "https://github.com/alexlinos/ADitor.git"
Issues = "https://github.com/alexlinos/ADitor/issues"

[project.scripts]
aditor = "aditor.cli:main"

[tool.setuptools.package-data]
# The hardening control catalog is data the engine loads at runtime, so it has
# to travel inside the wheel (and, later, the PyInstaller bundle) — not just sit
# in the source tree.
aditor = [
    "hardening/*.json",
    # The desktop app's window: local HTML/CSS/JS, no CDN and no bundler, so
    # the files ship as-is and have to travel inside the wheel (and, later, the
    # PyInstaller bundle) exactly like the control catalog.
    "app/web/*.html",
    "app/web/*.css",
    "app/web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings"
]
filterwarnings = [
    "ignore::DeprecationWarning:pyasn1.*",
    "ignore::DeprecationWarning:ldap3.*",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.ruff]
select = ["E", "F", "B", "I"]
ignore = []
line-length = 100
target-version = "py312"
