[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aditor"
version = "0.1.0"
description = "An Active Directory / GPO auditing tool and MCP server for hardening your environment"
requires-python = ">=3.12"
authors = [
    {name = "Alex Linos"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "active-directory", "mcp", "ldap", "ad", "group-policy", "gpo",
    "auditing", "hardening", "security", "directory-services",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Authentication",
]

dependencies = [
    # Pinned: the 2.0 line is a breaking rewrite with no mcp.types /
    # mcp.server.stdio, which aditor.server imports directly.
    "mcp==1.9.0",
    "ldap3>=2.9.1,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "starlette>=0.27",
    "uvicorn>=0.23.1",
    "cryptography>=41.0.0,<42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "black>=23.0.0,<24.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "ruff>=0.1.0,<0.2.0",
    "pytest-mock>=3.11.0,<4.0.0",
]
# Optional: enables get_gpo_contents to read GPO settings from SYSVOL over SMB.
smb = [
    "smbprotocol>=1.10.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/alexlinos/ADitor"
Documentation = "https://github.com/alexlinos/ADitor#readme"
Repository = "https://github.com/alexlinos/ADitor.git"
Issues = "https://github.com/alexlinos/ADitor/issues"

[project.scripts]
aditor = "aditor.server:main"

[tool.setuptools.package-data]
# The hardening control catalog is data the engine loads at runtime, so it has
# to travel inside the wheel (and, later, the PyInstaller bundle) — not just sit
# in the source tree.
aditor = ["hardening/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings"
]
filterwarnings = [
    "ignore::DeprecationWarning:pyasn1.*",
    "ignore::DeprecationWarning:ldap3.*",
    "ignore::UserWarning:pydantic.*",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.ruff]
select = ["E", "F", "B", "I"]
ignore = []
line-length = 100
target-version = "py312"
